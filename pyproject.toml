[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-evrp"
version = "0.1.0"
description = "Casablanca Stage-1 research benchmark for online electric parcel pickup."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RACE research project" }]
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "osmnx>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
