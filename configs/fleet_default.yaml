# Hypothetical light electric delivery van profile for scenario modelling.
# Not an observed Casablanca logistics vehicle.
label: hypothetical_light_ev_van
usable_battery_kwh: 40.0
payload_kg: 600.0
initial_soc: 1.0
min_reserve_soc: 0.15
consumption_wh_per_km: 200.0
consumption_note: >
  Assumed constant Wh/km for a small electric van under urban conditions.
  Not calibrated to HELECAR-D passenger cars without qualification.
depot_charging: depot_only
# Non-linear CC–CV style charging (piecewise-linear SOC–time). No linear kW clock.
charging_curve:
  model: piecewise_linear_soc_time
  peak_power_kw: 22.0
  note: >
    Cumulative hours from empty SOC. Concave: late SOC is slower (CV taper).
    Inspired by EVRP-NL practice (e.g. Montoya et al.); not a lab-measured pack curve.
  soc_breakpoints: [0.0, 0.50, 0.80, 0.90, 0.95, 1.0]
  cumulative_hours: [0.0, 0.91, 1.46, 1.72, 1.95, 2.40]
drive_speed_cap_kmh: 50
service_duration_override_min: null
n_vehicles: 3
problem_class_note: >
  Depot-only charging with non-linear charge duration. Closer to energy-constrained
  online pickup than classical en-route multi-station EVRP.
