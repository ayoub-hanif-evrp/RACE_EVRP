# Casablanca Solomon-style instance family: classes C / R / RC only.
# Synthetic demand on real OSM building/POI features (not random map dots).
generator_version: "0.5.0"
benchmark_version: "casablanca_solomon_style_v2"
parent_release: "casablanca_release_v1"
claim: >
  Classes C/R/RC with sizes 15/30/45 on frozen Casablanca OSM.
  Pickup locations are real OSM buildings/shops/offices/amenities.
  Not Euclidean Solomon files. Not observed courier tickets.

sizes: [15, 30, 45]
size_note: "15/30/45 customer ladder for urban EV pickup with small fleets."

classes:
  C:
    pattern: C
    name: clustered
    n_cluster_zones: 3
    note: "Customers concentrated in a few high-weight communes."
  R:
    pattern: R
    name: random_dispersed
    note: "Customers dispersed across eligible communes."
  RC:
    pattern: RC
    name: random_clustered_mix
    cluster_fraction: 0.5
    n_cluster_zones: 3
    note: "Half clustered, half dispersed."

# Single operational time profile (no C1/C2 numbering).
operational:
  horizon_hours: 8
  start_hour: 8
  time_window_hours: 2.0
  window_jitter_hours: 0.35
  service_duration_min: 10
  package_weight_kg: 20.0
  urgency: normal
  intensity_profile: daytime_peak
  weight_jitter: 0.3
  service_jitter_min: 3.0
  release_lead_min: 0
  attempt_feasible_certificate: false

pickup_frame:
  source_csv: "data/casablanca/pickup_candidates/pickup_candidates.csv"
  realistic_csv: "data/casablanca/pickup_candidates/pickup_candidates_realistic.csv"
  exclude_building_yes: true
  require_accessible: true
  max_snap_distance_m: 150
  semantics: "OSM feature centroid/point = customer location; snap_node = routing access only"

seeds:
  eval_base: 3001
  eval_per_class_size: 5
  train_seed_range: [20000000, 29999999]

fleet_default_n_vehicles:
  15: 3
  30: 5
  45: 6

intensity_profiles:
  daytime_peak:
    weights: [0,0,0,0,0,0,0.2,0.6,1.0,1.0,0.8,0.7,0.6,0.7,0.8,0.9,1.0,0.8,0.4,0.2,0.1,0,0,0]
  morning_peak:
    weights: [0,0,0,0,0,0,0.4,1.0,1.0,0.9,0.6,0.4,0.3,0.3,0.4,0.5,0.6,0.4,0.2,0.1,0,0,0,0]

spatial:
  population_weight: 0.6
  commercial_weight: 0.4
  max_snap_distance_m: 150
