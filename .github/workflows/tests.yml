name: Deterministic tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest networkx pandas numpy
      - name: Run lightweight deterministic suite
        env:
          PYTHONPATH: src
        run: |
          pytest -q --tb=line \
            tests/test_race_csc.py \
            tests/test_prompt2_metrics_accounting.py \
            tests/test_timing_causality.py \
            tests/test_deadline_commit_wait.py \
            tests/test_communication_value_cases.py \
            tests/test_trust_horizon.py \
            tests/test_race_cooperative.py \
            tests/test_race_comm_protocol_v2.py
